<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="210" viewBox="0 0 1000 210"><rect width="1000" height="210" fill="white"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10" fill="#334155"/></marker></defs><g font-family="Arial,sans-serif" text-anchor="middle"><text x="500" y="32" font-size="22" fill="#0f172a">Shared stochastic representation</text><rect x="30" y="65" width="205" height="75" rx="8" fill="#e4eff9" stroke="#6a91a4"/><text x="132.5" y="97" font-size="17" fill="#0f172a">Observation + action</text><text x="132.5" y="122" font-size="14" fill="#475569">history</text><path d="M240 102H268" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/><rect x="275" y="65" width="205" height="75" rx="8" fill="#e4f2ec" stroke="#6a91a4"/><text x="377.5" y="97" font-size="17" fill="#0f172a">RSSM</text><text x="377.5" y="122" font-size="14" fill="#475569">state h</text><path d="M485 102H513" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/><rect x="520" y="65" width="205" height="75" rx="8" fill="#e4eff9" stroke="#6a91a4"/><text x="622.5" y="97" font-size="17" fill="#0f172a">Affine projection</text><text x="622.5" y="122" font-size="14" fill="#475569">mean μ = Wh + b</text><path d="M730 102H758" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/><rect x="765" y="65" width="205" height="75" rx="8" fill="#e4f2ec" stroke="#6a91a4"/><text x="867.5" y="97" font-size="17" fill="#0f172a">Sampled code</text><text x="867.5" y="122" font-size="14" fill="#475569">z = μ + ε</text><text x="500" y="184" font-size="16" fill="#475569">ε ~ N(0, I) · Nested prefixes use the first blocks of the same sampled code</text></g></svg>
