<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="410" viewBox="0 0 1200 410"><rect width="1200" height="410" fill="white"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10" fill="#334155"/></marker></defs><g font-family="Arial,sans-serif" text-anchor="middle" fill="#0f172a"><text x="600" y="35" font-size="25">Reborn + Harmony: adaptive weights, fixed rate and control objectives</text><g stroke="#6596a0" fill="#e6f4ef"><rect x="35" y="70" width="330" height="85" rx="10"/><rect x="435" y="70" width="330" height="85" rx="10"/></g><g stroke="#b8945e" fill="#fff3df"><rect x="35" y="185" width="330" height="85" rx="10"/><rect x="435" y="185" width="330" height="85" rx="10"/></g><rect x="35" y="300" width="730" height="75" rx="10" fill="#eef2f7" stroke="#8291a5"/><rect x="915" y="155" width="245" height="100" rx="10" fill="#e7eef9" stroke="#6c90b9"/><g font-size="20"><text x="200" y="102">Observation group L_O</text><text x="600" y="102">w_O L_O + softplus(s_O)</text><text x="200" y="217">Reward group L_T</text><text x="600" y="217">w_T L_T + softplus(s_T)</text><text x="1037" y="199">Total objective</text><text x="400" y="330">Fixed losses + cumulative rate</text></g><g font-size="16" fill="#475569"><text x="200" y="133">λ_H Haar + λ_S successor features</text><text x="600" y="133">w_O = exp(−s_O)</text><text x="200" y="248">λ_r reward + λ_S λ_Q action-value</text><text x="600" y="248">w_T = exp(−s_T)</text><text x="400" y="357">Base image / RSSM KL / continuation / actor / critics + λ_H β R</text><text x="1037" y="229">Shared optimizer</text><text x="600" y="400">Two learned scalars, initialized at zero. Positive weighting changes scale, not gradient direction.</text></g><g fill="none" stroke="#334155" stroke-width="2" marker-end="url(#a)"><path d="M365 113H427"/><path d="M365 228H427"/><path d="M765 113H845V180H907"/><path d="M765 228H907"/><path d="M765 337H845V244H907"/></g></g></svg>
